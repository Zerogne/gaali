<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plate Live</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 16px;
      }
      pre {
        background: #111;
        color: #0f0;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
      .ok {
        color: #0a0;
        font-weight: 700;
      }
      .bad {
        color: #a00;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h2>✅ Plate WebSocket Feed</h2>
    <div id="status">Connecting...</div>

    <h3>Latest Plate:</h3>
    <div id="plate" style="font-size: 28px; font-weight: 800">—</div>

    <h3>Log:</h3>
    <pre id="log"></pre>

    <script>
      const host = location.hostname; // localhost OR 192.168.1.50 automatically
      const ws = new WebSocket(`ws://${host}:3001`);

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const plateEl = document.getElementById("plate");

      function log(msg) {
        logEl.textContent =
          `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent;
      }

      ws.onopen = () => {
        statusEl.innerHTML = `<span class="ok">WS Connected ✅</span>`;
        log("WS Connected");
      };
      ws.onclose = () => {
        statusEl.innerHTML = `<span class="bad">WS Closed ❌</span>`;
        log("WS Closed");
      };
      ws.onerror = () => {
        statusEl.innerHTML = `<span class="bad">WS Error ❌</span>`;
        log("WS Error");
      };

      ws.onmessage = (e) => {
        log("MSG: " + e.data);
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "plate_event" && msg.plate) {
            plateEl.textContent = msg.plate;
          }
        } catch {}
      };
    </script>
  </body>
</html>
