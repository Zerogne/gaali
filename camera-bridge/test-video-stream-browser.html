<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Stream Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #b0b0b0;
            font-size: 14px;
        }
        
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .status {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            color: #b0b0b0;
        }
        
        .status-value {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .status-value.error {
            color: #f44336;
        }
        
        .status-value.warning {
            color: #ff9800;
        }
        
        .video-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            aspect-ratio: 16/9;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .no-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            text-align: center;
        }
        
        .logs {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #666;
            margin-right: 10px;
        }
        
        .log-info {
            color: #4CAF50;
        }
        
        .log-warn {
            color: #ff9800;
        }
        
        .log-error {
            color: #f44336;
        }
        
        .log-frame {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📹 Video Stream Test</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Camera ID:</label>
                <select id="cameraId">
                    <option value="camera-1">Camera 1</option>
                    <option value="camera-2">Camera 2</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>WebSocket Port:</label>
                <input type="number" id="wsPort" value="3004" min="1" max="65535">
            </div>
            
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        </div>
        
        <div class="status" id="status">
            <div class="status-item">
                <span class="status-label">Connection:</span>
                <span class="status-value error" id="statusConnection">Disconnected</span>
            </div>
            <div class="status-item">
                <span class="status-label">Frames Received:</span>
                <span class="status-value" id="statusFrames">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Frame Rate:</span>
                <span class="status-value" id="statusFPS">0 FPS</span>
            </div>
            <div class="status-item">
                <span class="status-label">Last Frame:</span>
                <span class="status-value" id="statusLastFrame">Never</span>
            </div>
            <div class="status-item">
                <span class="status-label">Errors:</span>
                <span class="status-value" id="statusErrors">0</span>
            </div>
        </div>
        
        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="no-video" id="noVideo">No video stream</div>
        </div>
        
        <div class="logs" id="logs"></div>
    </div>

    <script>
        let ws = null;
        let stats = {
            framesReceived: 0,
            errors: 0,
            frameIntervals: [],
            lastFrameTime: null
        };

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
            
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateStatus() {
            document.getElementById('statusConnection').textContent = ws && ws.readyState === WebSocket.OPEN ? 'Connected' : 'Disconnected';
            document.getElementById('statusConnection').className = ws && ws.readyState === WebSocket.OPEN ? 'status-value' : 'status-value error';
            
            document.getElementById('statusFrames').textContent = stats.framesReceived;
            
            const fps = stats.frameIntervals.length > 0
                ? (1000 / (stats.frameIntervals.reduce((a, b) => a + b, 0) / stats.frameIntervals.length)).toFixed(1)
                : 0;
            document.getElementById('statusFPS').textContent = fps > 0 ? `${fps} FPS` : '0 FPS';
            
            const lastFrame = stats.lastFrameTime
                ? new Date(stats.lastFrameTime).toLocaleTimeString()
                : 'Never';
            document.getElementById('statusLastFrame').textContent = lastFrame;
            
            document.getElementById('statusErrors').textContent = stats.errors;
            document.getElementById('statusErrors').className = stats.errors > 0 ? 'status-value error' : 'status-value';
        }

        function connect() {
            const cameraId = document.getElementById('cameraId').value;
            const wsPort = document.getElementById('wsPort').value;
            const wsUrl = `ws://localhost:${wsPort}/video/${cameraId}`;
            
            log(`Connecting to ${wsUrl}...`, 'info');
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('✅ WebSocket connected!', 'info');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    updateStatus();
                };
                
                ws.onmessage = (event) => {
                    handleMessage(event.data);
                };
                
                ws.onerror = (error) => {
                    log('❌ WebSocket error', 'error');
                    stats.errors++;
                    updateStatus();
                };
                
                ws.onclose = (event) => {
                    log(`🔌 WebSocket closed (code: ${event.code})`, 'warn');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('noVideo').style.display = 'block';
                    updateStatus();
                };
                
            } catch (error) {
                log(`❌ Connection error: ${error.message}`, 'error');
                stats.errors++;
                updateStatus();
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                log('Disconnected', 'info');
                document.getElementById('noVideo').style.display = 'block';
                updateStatus();
            }
        }

        function handleMessage(data) {
            try {
                // Check if it's a Blob
                if (data instanceof Blob) {
                    log('📨 Received binary data (Blob)', 'info');
                    stats.framesReceived++;
                    updateStatus();
                    return;
                }

                // Try to parse as JSON
                const message = JSON.parse(data);
                
                if (message.type === 'connected') {
                    log(`✅ Connection confirmed: ${message.message || 'Connected'}`, 'info');
                    if (message.cameraId) {
                        log(`   Camera ID: ${message.cameraId}`, 'info');
                    }
                    return;
                }

                if (message.type === 'frame') {
                    stats.framesReceived++;
                    
                    if (message.data && typeof message.data === 'string') {
                        const video = document.getElementById('video');
                        video.src = `data:image/jpeg;base64,${message.data}`;
                        document.getElementById('noVideo').style.display = 'none';
                        
                        // Calculate frame rate
                        const now = Date.now();
                        if (stats.lastFrameTime) {
                            const interval = now - stats.lastFrameTime;
                            stats.frameIntervals.push(interval);
                            // Keep only last 30 intervals for FPS calculation
                            if (stats.frameIntervals.length > 30) {
                                stats.frameIntervals.shift();
                            }
                        }
                        stats.lastFrameTime = now;
                        
                        // Log every 30th frame
                        if (stats.framesReceived % 30 === 0) {
                            const fps = stats.frameIntervals.length > 0
                                ? (1000 / (stats.frameIntervals.reduce((a, b) => a + b, 0) / stats.frameIntervals.length)).toFixed(1)
                                : 0;
                            log(`📹 Frame #${stats.framesReceived} received (~${fps} FPS)`, 'frame');
                        }
                    } else {
                        log('⚠️ Frame message has no data', 'warn');
                    }
                } else {
                    log(`ℹ️ Received message type: ${message.type}`, 'info');
                }
                
                updateStatus();
                
            } catch (error) {
                log(`❌ Error parsing message: ${error.message}`, 'error');
                stats.errors++;
                updateStatus();
            }
        }

        // Initialize
        updateStatus();
        log('Ready to test video stream', 'info');
    </script>
</body>
</html>
